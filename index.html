        :root {
            --sky: #E4EDF3;
            --paper: #F8FBFD;
            --ink: #16222D;
            --red: #C21F30;
            --mist: #9DB1C0;
            --rose: #F3DBD8;
            --sub: #587083;
            --sz: 56px;
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            background: var(--sky);
            color: var(--ink);
            font: 16px/1.7 "f34", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        button, input {
            font: inherit;
            color: inherit;
        }
        :focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 3px;
        }
        .hero {
            display: grid;
            align-content: end;
            padding: 7vh 7vw 3vh;
        }
        h1 {
            font: 400 clamp(3.6rem, 12vw, 9rem)/1.05 "f46", "Malgun Gothic", sans-serif;
            letter-spacing: -.02em;
        }
        .bar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: grid;
            gap: .7rem;
            padding: .8rem 7vw;
            background: rgba(248, 251, 253, .94);
            backdrop-filter: blur(10px);
            border-block: 1px solid var(--mist);
        }
        .rw {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem 1.2rem;
            align-items: center;
        }
        .bar label {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-size: .9rem;
            color: #3d4f5e;
        }
        .bar input[type=text], .bar input[type=search] {
            background: #fff;
            border: 1px solid var(--mist);
            padding: .45rem .8rem;
            border-radius: 2px;
            min-width: 0;
        }
        #txt { width: min(26rem, 70vw); }
        #q { width: min(15rem, 60vw); }
        .bar input[type=range] {
            accent-color: var(--red);
            width: 8rem;
        }
        .seg {
            display: flex;
            gap: .3rem;
        }
        .sel {
            background: #fff;
            border: 1px solid var(--mist);
            padding: .45rem .8rem;
            border-radius: 2px;
            cursor: pointer;
        }
        .seg button {
            background: none;
            border: 1px solid var(--mist);
            padding: .25rem .8rem;
            border-radius: 2px;
            cursor: pointer;
            font-size: .88rem;
        }
        .seg button[aria-pressed=true] {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }
        .seg button:hover:not([aria-pressed=true]) {
            background: var(--rose);
        }
        .cnt {
            font-size: .88rem;
            color: var(--sub);
            min-width: 3.5rem;
        }
        .btn {
            cursor: pointer;
            background: var(--red);
            color: #fff;
            border: 0;
            padding: .5rem 1.1rem;
            border-radius: 2px;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover { background: #9f1726; }
        .push { margin-left: auto; }
        main {
            padding: 2vh 7vw 10vh;
            background: var(--paper);
            min-height: 60vh;
        }
        .fam {
            display: grid;
            grid-template-columns: 12rem 1fr;
            gap: 0 3rem;
            padding: 4rem 0 1rem;
            border-top: 1px solid var(--mist);
        }
        .fam:first-child { border-top: 0; }
        .fam header {
            position: sticky;
            top: 8.5rem;
            align-self: start;
        }
        .fam h2 {
            font-size: 1.5rem;
            line-height: 1.3;
        }
        .fam header span {
            font-size: .85rem;
            color: var(--sub);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: .3rem 1.5rem;
            align-items: center;
            padding: 1.4rem 0;
            border-bottom: 1px solid #dbe5ec;
        }
        .row:last-child { border-bottom: 0; }
        .meta {
            grid-column: 1/-1;
            font-size: .85rem;
            color: var(--sub);
        }
        .meta b {
            color: var(--red);
            font-weight: 600;
            margin-right: .7rem;
        }
        mark {
            background: var(--rose);
            color: inherit;
        }
        .smp {
            font-size: var(--sz);
            line-height: 1.3;
            overflow-wrap: anywhere;
            min-height: 1.3em;
        }
        .dl {
            font-size: .9rem;
            color: var(--red);
            text-decoration: none;
            border-bottom: 1px solid var(--red);
            white-space: nowrap;
        }
        .dl:hover { background: var(--rose); }
        .gal {
            display: grid;
            grid-template-columns: 13rem 1fr;
            gap: 3rem;
            padding-top: 3rem;
        }
        .tabs {
            display: flex;
            flex-direction: column;
            gap: .15rem;
            position: sticky;
            top: 9rem;
            align-self: start;
        }
        .tab {
            text-align: left;
            background: none;
            border: 0;
            border-left: 2px solid #dbe5ec;
            padding: .35rem 1rem;
            cursor: pointer;
            color: var(--sub);
        }
        .tab:hover { color: var(--ink); }
        .tab[aria-pressed=true] {
            border-left-color: var(--red);
            color: var(--ink);
            font-weight: 700;
        }
        .wts {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 2rem;
        }
        .wb {
            background: none;
            border: 1px solid var(--mist);
            padding: .35rem 1rem;
            border-radius: 2px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .wb:hover { background: var(--rose); }
        .wb[aria-pressed=true] {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }
        .sname {
            font-size: .9rem;
            color: var(--sub);
        }
        .sname b {
            color: var(--red);
            margin-right: .7rem;
        }
        .big {
            font-size: calc(var(--sz)*1.7);
            line-height: 1.25;
            overflow-wrap: anywhere;
            margin: 1rem 0 2rem;
            min-height: 1.25em;
        }
        .glyph {
            font-size: 1.9rem;
            line-height: 1.6;
            padding: 1.5rem 0;
            border-block: 1px solid #dbe5ec;
            overflow-wrap: anywhere;
        }
        .ctl {
            display: flex;
            gap: .6rem;
            align-items: center;
            margin-top: 1.8rem;
        }
        .ctl .nv {
            background: none;
            border: 1px solid var(--mist);
            width: 2.6rem;
            height: 2.4rem;
            border-radius: 2px;
            cursor: pointer;
        }
        .ctl .nv:hover { background: var(--rose); }
        .none {
            padding: 6rem 0;
            color: var(--sub);
            display: grid;
            gap: 1rem;
            justify-items: start;
        }
        footer {
            padding: 3rem 7vw 4rem;
            font-size: .85rem;
            color: #3d4f5e;
            display: grid;
            gap: .4rem;
        }
        footer a {
            display: block;
            word-break: break-all;
        }
        [hidden] { display: none !important; }

        @media(max-width:760px) {
            .hero { padding: 6vh 6vw 2.5vh; }
            h1 { font-size: clamp(3rem, 15vw, 5rem); }
            main, .bar, footer {
                padding-left: 6vw;
                padding-right: 6vw;
            }
            .bar { position: static; }
            .rw { gap: .6rem; }
            .bar label { flex: 1; }
            .bar input[type=range] { width: auto; flex: 1; }
            #txt { width: 100%; }
            #q { flex: 1 1 100%; width: 100%; }
            .push { margin-left: auto; }
            .bar .btn { flex: 1 1 100%; text-align: center; }
            .fam, .gal { grid-template-columns: 1fr; gap: 1rem; }
            .fam { padding-top: 2.5rem; }
            .fam header { position: static; display: flex; gap: .7rem; align-items: baseline; }
            .row { grid-template-columns: 1fr; padding: 1.1rem 0; }
            .dl { justify-self: start; }
            .gal { padding-top: 1.5rem; }
            .tabs {
                position: static;
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: .4rem;
            }
            .tab { border-left: 0; border-bottom: 2px solid #dbe5ec; white-space: nowrap; }
            .tab[aria-pressed=true] { border-bottom-color: var(--red); }
            .glyph { font-size: 1.35rem; }
            .wb { font-size: 1rem; }
            .ctl .btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>북녘의 글꼴</h1>
    </section>

    <div class="bar">
        <div class="rw">
            <label>문구 <input id="txt" type="text" value="고요한 아침의 나라 가나다라마바사 0123"></label>
            <label>크기 <input id="sz" type="range" min="20" max="140" value="56"></label>
        </div>
        <div class="rw">
            <input id="q" type="search" placeholder="이름, 계열, 초성 검색 (예: ㅊㄹㅁ)" aria-label="글꼴 검색" autocomplete="off">
            <select class="sel" id="wt" aria-label="굵기">
                <option value="전체">굵기 전체</option>
                <option>가는</option>
                <option>보통</option>
                <option>굵은</option>
                <option>흑</option>
            </select>
            <span class="cnt" id="cnt" aria-live="polite"></span>
            <div class="seg push" id="vw">
                <button data-v="list" aria-pressed="true">리스트</button>
                <button data-v="gal" aria-pressed="false">갤러리</button>
            </div>
            <a class="btn" href="all-fonts.zip" download="북녘의 글꼴 전체.zip">전체 받기 (zip)</a>
        </div>
    </div>

    <main>
        <div id="list"></div>
        <div id="gal" class="gal" hidden>
            <nav class="tabs" id="tabs"></nav>
            <div>
                <div class="wts" id="wts"></div>
                <div id="spec"></div>
            </div>
        </div>
        <div class="none" id="none" hidden>
            <span>찾는 글꼴이 없습니다.</span>
            <button class="btn" id="clr">검색 지우기</button>
        </div>
    </main>

    <footer>
        <b>출처</b>
        <a href="http://nc.f5.si/site/fonts/kp/2/%EB%B6%81%ED%95%9C%EA%B8%80%EA%BC%B4(16%EA%B0%9C)/">http://nc.f5.si/site/fonts/kp/2/%EB%B6%81%ED%95%9C%EA%B8%80%</a>

        <p style="margin-top:.8rem">상업적으로 쓰기 전에 각 글꼴의 사용 조건을 확인하세요.</p>

const $ = s => document.querySelector(s);
const T = $('#txt');
const GLY = '가나다라마바사아자차카타파하 거너더러머버서어저처커터퍼허 ABCDEFG abcdefg 0123456789 ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
const CH = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const SYN = { 가는: ' 얇은 light', 보통: ' regular medium 중간', 굵은: ' 두꺼운 bold', 흑: ' 검은 black' };
const norm = s => s.toLowerCase().replace(/[\s-]/g, '');

const chos = s => [...s].map(c => {
    const n = c.charCodeAt(0) - 44032;
    return n >= 0 && n < 11172 ? CH[Math.floor(n / 588)] : c;
}).join('');

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const fonts = D.flatMap((f, i) => f.fonts.map(x => Object.assign(x, {
    fi: i,
    fam: f.name,
    ok: true,
    hay: norm(x.name + f.name + x.en + x.w + (SYN[x.w] || '')),
    cho: norm(chos(x.name + f.name))
})));

const byId = Object.fromEntries(fonts.map(x => [x.id, x]));
const S = { q: '', w: '전체', v: 'list', fam: 0, cur: null };
const isCho = t => /^[ㄱ-ㅎ]+$/.test(t);
const toks = () => S.q.toLowerCase().split(/\s+/).filter(Boolean);

function match(x) {
    if (S.w !== '전체' && x.w !== S.w) return false;
    return toks().every(t => {
        const n = norm(t);
        return x.hay.includes(n) || (isCho(n) && x.cho.includes(n));
    });
}

function hl(name) {
    const low = name.toLowerCase(), cn = chos(name), m = new Array(name.length).fill(false);
    toks().forEach(t => {
        let i = low.indexOf(t);
        let L = t.length;
        if (i < 0 && isCho(t)) { i = cn.indexOf(t); }
        if (i >= 0) for (let k = i; k < i + L; k++) m[k] = true;
    });
    
    let o = '', on = false;
    [...name].forEach((c, k) => {
        if (m[k] && !on) { o += '<mark>'; on = true; }
        if (!m[k] && on) { o += '</mark>'; on = false; }
        o += esc(c);
    });
    return o + (on ? '</mark>' : '');
}

const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
        const r = e.target;
        r.querySelector('.smp').style.fontFamily = '"' + r.dataset.id + '", "Malgun Gothic", sans-serif';
        io.unobserve(r);
    }
}), { rootMargin: '700px' });

$('#list').innerHTML = D.map((f, i) => `
    <section class="fam" data-i="${i}">
        <header>
            <h2>${f.name}</h2>
            <span></span>
        </header>
        <div>${f.fonts.map(x => `
            <article class="row" data-id="${x.id}">
                <div class="meta"><b>${esc(x.name)}</b>${(x.kb / 1024).toFixed(1)}MB</div>
                <p class="smp"></p>
                <a class="dl" href="fonts/${x.id}.ttf" download="${esc(x.name)}.ttf">받기</a>
            </article>`).join('')}
        </div>
    </section>
`).join('');

const rows = [...document.querySelectorAll('.row')];
rows.forEach(r => io.observe(r));
const sample = () => T.value || '가나다라마바사';

function fillText() {
    document.querySelectorAll('.smp, .big').forEach(p => p.textContent = sample());
}

function visibleFonts() { 
    return fonts.filter(x => x.ok); 
}

function applyList() {
    rows.forEach(r => {
        const x = byId[r.dataset.id];
        r.hidden = !x.ok;
        if (x.ok) r.querySelector('b').innerHTML = hl(x.name);
    });
    
    document.querySelectorAll('.fam').forEach(s => {
        const n = D[s.dataset.i].fonts.filter(x => x.ok).length;
        s.hidden = !n;
        s.querySelector('header span').textContent = n + '종';
    });
}

function renderGal() {
    const vis = visibleFonts();
    const fams = [...new Set(vis.map(x => x.fi))];
    
    if (!fams.length) {
        $('#tabs').innerHTML = '';
        $('#wts').innerHTML = '';
        $('#spec').innerHTML = '';
        return;
    }
    
    if (!fams.includes(S.fam)) S.fam = fams[0];
    const list = vis.filter(x => x.fi === S.fam);
    
    if (!S.cur || !list.some(x => x.id === S.cur)) S.cur = list[0].id;
    
    $('#tabs').innerHTML = fams.map(i => `
        <button class="tab" data-fam="${i}" aria-pressed="${i === S.fam}">${D[i].name}</button>
    `).join('');
    
    $('#wts').innerHTML = list.map(x => `
        <button class="wb" data-f="${x.id}" aria-pressed="${x.id === S.cur}" style="font-family:'${x.id}', 'Malgun Gothic', sans-serif">${hl(x.name)}</button>
    `).join('');
    
    const x = byId[S.cur], ff = `font-family:'${x.id}', 'Malgun Gothic', sans-serif`;
    const idx = vis.findIndex(v => v.id === x.id);
    
    $('#spec').innerHTML = `
        <div class="sname">
            <b>${esc(x.name)}</b>${(x.kb / 1024).toFixed(1)}MB, ${idx + 1} / ${vis.length}
        </div>
        <p class="big" style="${ff}"></p>
        <p class="glyph" style="${ff}">${GLY}</p>
        <div class="ctl">
            <button class="nv" data-step="-1" aria-label="이전 글꼴">&#8592;</button>
            <button class="nv" data-step="1" aria-label="다음 글꼴">&#8594;</button>
            <a class="btn" href="fonts/${x.id}.ttf" download="${esc(x.name)}.ttf">이 글꼴 받기</a>
        </div>
    `;
    $('#spec .big').textContent = sample();
}

function step(d) {
    const vis = visibleFonts();
    if (!vis.length) return;
    const i = vis.findIndex(v => v.id === S.cur);
    const n = vis[(i + d + vis.length) % vis.length];
    S.cur = n.id;
    S.fam = n.fi;
    renderGal();
}

function refresh() {
    fonts.forEach(x => x.ok = match(x));
    const n = visibleFonts().length;
    $('#cnt').textContent = n + '종';
    $('#none').hidden = n > 0;
    $('#list').hidden = S.v !== 'list' || n === 0;
    $('#gal').hidden = S.v !== 'gal' || n === 0;
    applyList();
    if (S.v === 'gal') renderGal();
}

if (innerWidth < 760) {
    document.documentElement.style.setProperty('--sz', '32px');
    $('#sz').value = 32;
}

fillText();
refresh();
T.oninput = fillText;

$('#sz').oninput = e => document.documentElement.style.setProperty('--sz', e.target.value + 'px');
$('#q').oninput = e => { S.q = e.target.value.trim(); refresh(); };
$('#q').onkeydown = e => { 
    if (e.key === 'Escape') { e.target.value = ''; S.q = ''; refresh(); }
};

$('#clr').onclick = () => { 
    $('#q').value = ''; 
    S.q = ''; 
    S.w = '전체'; 
    $('#wt').value = '전체'; 
    refresh(); 
    $('#q').focus(); 
};

$('#wt').onchange = e => { S.w = e.target.value; refresh(); };

$('#vw').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    S.v = b.dataset.v;
    document.querySelectorAll('#vw button').forEach(x => x.setAttribute('aria-pressed', x === b));
    refresh();
};

$('#gal').onclick = e => {
    const t = e.target.closest('[data-fam], [data-f], [data-step]');
    if (!t) return;
    
    if (t.dataset.fam !== undefined) {
        S.fam = +t.dataset.fam;
        S.cur = null;
        renderGal();
    } else if (t.dataset.f) {
        S.cur = t.dataset.f;
        renderGal();
    } else {
        step(+t.dataset.step);
    }
};

document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT') {
        e.preventDefault();
        $('#q').focus();
        return;
    }
    if (S.v === 'gal' && tag !== 'INPUT') {
        if (e.key === 'ArrowRight') step(1);
        if (e.key === 'ArrowLeft') step(-1);
    }
});

</script>
